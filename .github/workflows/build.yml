name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas do Android SDK (garantia extra)
        run: yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        run: |
          gradle assembleDebug --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="v1.${{ github.run_number }}"

      - name: Publicar o APK gerado (artifact temporario)
        uses: actions/upload-artifact@v4
        with:
          name: audioroulette-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Criar Release no GitHub (pro atualizador do app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="v1.${{ github.run_number }}"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" "audioroulette-$VERSAO.apk"
          gh release delete "$VERSAO" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$VERSAO" "audioroulette-$VERSAO.apk" \
            --repo "${{ github.repository }}" \
            --title "Versão $VERSAO" \
            --notes "Build automático gerado pelo GitHub Actions (execução número ${{ github.run_number }})."
